name: Dependency checks

on:
  push:
    paths:
      - requirements.txt
      - requirements-dev.txt
      - "models/**"
      - "datasets/**"
      - "utils/**"
      - "losses/**"
      - train.py
      - test.py
      - "tests/**"
      - .github/workflows/dependencies.yml
  pull_request:
    paths:
      - requirements.txt
      - requirements-dev.txt
      - "models/**"
      - "datasets/**"
      - "utils/**"
      - "losses/**"
      - train.py
      - test.py
      - "tests/**"
      - .github/workflows/dependencies.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path
          packages = [line.strip() for line in Path('requirements.txt').read_text().splitlines()
                      if line.startswith(('torch==', 'torchvision=='))]
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', '--index-url',
                                 'https://download.pytorch.org/whl/cpu', *packages])
          PY
          .venv/bin/python -m pip install -r requirements.txt -r requirements-dev.txt
          .venv/bin/python -m pip check
      - name: Test runtime and checkpoint loading
        run: |
          .venv/bin/python -m unittest discover -s tests -v
          .venv/bin/python train.py --help
          .venv/bin/python test.py --help
      - name: Audit installed dependencies
        run: |
          .venv/bin/python - <<'PY'
          from importlib.metadata import distributions
          from pathlib import Path
          from packaging.version import Version
          packages = []
          for distribution in distributions():
              name = distribution.metadata['Name']
              version = distribution.version
              if name.lower() in {'torch', 'torchvision'}:
                  version = Version(version).public
              packages.append(f'{name}=={version}')
          Path('.venv/audit-requirements.txt').write_text('\n'.join(sorted(packages)) + '\n')
          PY
          .venv/bin/python -m pip_audit --strict --no-deps --disable-pip --progress-spinner off -r .venv/audit-requirements.txt
